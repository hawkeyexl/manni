# manni validating its own docs.
#
# This file exists so the config-discovery path — the one most users actually
# hit, and the subject of docs/proposals/0004 — is exercised by the project on
# itself, rather than only by unit tests against temp directories. CI used to
# spell the schema out on the command line; a bare `manni meta validate` at the
# repo root now reaches the same verdict.
#
# One file for the whole family, one top-level key per tool (proposal 0033),
# plus the one key that is nobody's: `collections:` declares the document sets
# every tool reads (proposal 0041). The metadata tool reads `collections:` and
# `meta:`, so a sibling tool's section can sit beside them without either
# reading the other's keys.
#
# It is deliberately narrow, because a config at the repo root is discovered by
# *every* manni run anywhere beneath it — including this repo's own test
# suite. Every key here is ambient behaviour for all of them, so there are only
# two.
#
# In particular the docs schema hangs off `overrides:` rather than top-level
# `schemas:`. `schemas:` is the default set applied to **every** validated file,
# not only the collection's members, so putting it there would judge a fixture
# under `test/` against the docs frontmatter contract. An override applies only
# to the files it governs; everything else keeps DEFAULT_SCHEMAS.

# What a bare `manni meta validate` checks: the published docs pages. Named
# `site` rather than `docs`, which `collections:` refuses — `docs` is the table
# every `manni meta query` reads, and a view of that name would shadow it.
# The citation tool reads it too: a bare `manni cite check` checks these same
# pages against this checkout, and every other cite key is a default, so it
# needs no section of its own.
collections:
  - name: site
    paths:
      - "docs/src/content/docs/**/*.{md,mdx}"
    # Where those pages are published, and so what `manni a11y check` checks
    # when it is given no URLs of its own (proposal 0041, rule 12). It is the
    # local preview rather than the deployed site, because the point of the
    # check is the build a pull request produces, before it deploys. To run it
    # by hand: `cd docs && npm run build && npx astro preview --host 127.0.0.1
    # --port 4321`, then `manni a11y check` from anywhere in the repo. The Docs
    # workflow's `a11y` job runs exactly that. To check the live site instead,
    # name it: `manni a11y check https://hawkeyexl.github.io/manni/`.
    #
    # It is not `a11y.urls` because it is a fact about where this collection
    # of documents lives, not a setting of the accessibility tool — the whole
    # reason a collection is declared once for every tool to read.
    url: http://127.0.0.1:4321/manni/
    externalMetadata:
      - file: "{page}.citations.yaml"
        keys: [citations]
      # No `keys` (proposal 0068): this manifest owns every other field the
      # page's schemas mark `x-manni-location: external`, so a page's
      # bookkeeping sits beside it and never reaches the published site.
      - file: "{page}.meta.yaml"

# Where Vale's configuration is, for the tools that run Vale. `manni term lint`
# runs it over the glossary's definitions, and `manni term write -f vale` reads
# it to say whether a section uses the `Terms` style it writes. It is the same
# .vale.ini the repo's prose check reads, so a term definition is held to the
# house voice every other page is. The terminology tool needs no section of its
# own: every `term:` key has a default, and the glossary's term pages are
# already members of `site`, so a bare `manni term check` finds them.
tools:
  vale:
    config: .vale.ini

meta:
  # No `fields` (proposal 0069): derive manages the merge-safe fields each
  # page's schemas claim. Here that is owner, created and last-updated from
  # stewardship, and provenance from ai-context, stamped into each page's
  # manifest. They stay current after a squash merge, which this gate needs.
  # Authors and reviewers would not, so they stay derivable at read time only.
  derive:
    # The published pages only. Stewardship is a default schema (proposal
    # 0070), so every fixture under the repository claims `owner` too, and
    # this file is ambient for every run beneath it, the test suite included.
    collections: [site]
    sources: [git, codeowners]
    # CODEOWNERS format, at a path GitHub does not search, so it names an
    # owner without turning on automatic review requests.
    codeowners: docs/content-strategy/OWNERS
    machines: ["*[bot]", "noreply@anthropic.com"]

  # The docs site dogfoods the built-in vocabularies. `defaults: true` puts the
  # default set first, and `strict: true` stacks each default's strict overlay
  # beside it (proposal 0070). First match wins, so the glossary comes before
  # the collection it belongs to.
  overrides:
    # Glossary term pages follow the terminology vocabulary and keep
    # `type: term`, which `manni term` reads, so they take no TGDP type. The
    # glossary's index is not a term page, so the glob leaves it to the site.
    # Terminology is not a default, so its overlay is listed by hand.
    - files: "docs/src/content/docs/meta/reference/glossary/!(index).mdx"
      defaults: true
      strict: true
      schemas:
        - ./docs/doc-frontmatter.schema.json
        - astro:starlight:0.41
        - manni:terminology:1.0.0
        - manni:terminology-strict:1.0.0
    # Every other published page. Each one must declare a non-empty title and
    # description, which the house schema requires.
    - collection: site
      defaults: true
      strict: true
      schemas:
        - ./docs/doc-frontmatter.schema.json
        # The platform contract this site actually runs on. The house schema
        # above stays because Starlight itself does not require `description`
        # and this site does; what the built-in adds is everything the house
        # schema left unconstrained — `sidebar.order` must be a number,
        # `template` must be `doc` or `splash`, a `badge` object must carry
        # `text`. Before it existed, every Starlight key on every page went
        # unchecked.
        - astro:starlight:0.41
        # A page's TGDP template, in `type`. Open, because a few pages are
        # types TGDP does not publish. `strict` leaves it open: it is not a
        # default schema.
        - tgdp:templates:1.1

# The accessibility tool reads `a11y:` and nothing else. Same narrowness as
# above, for the same reason: this file is ambient for every run beneath the
# repo, the test suite included. The a11y CLI tests therefore run from a temp
# directory outside the repo, where discovery finds nothing, so the keys here
# never reach them. Every key is a default a flag on the command line beats.
#
# It carries no `urls:`. The seeds come from the `site` collection's `url:`
# above, which is the fallback a11y uses when nothing is named on the command
# line and this section sets no urls of its own.
a11y:
  # The project's floor: findings below it are dropped before the score and
  # the exit code are decided. The values are the family scale every manni
  # tool shares, `notice | warning | error`; axe's four impact levels are
  # mapped onto it, `critical` and `serious` both landing as `error`.
  # `--severity <level>` on the command line wins. The built-in default is
  # `notice`, everything axe reports, and the floor sits there now that the
  # site carries no finding at any level. It is a ratchet: lower it as
  # findings are fixed, never raise it.
  severity: notice

# The evals tool grading this site. A bare `manni docevals run` reads the
# `site` collection above, the same pages a bare `manni meta validate` reads.
# Each page's evals sit in its `{page}.meta.yaml` manifest, beside an
# `eval-suite:` naming the domain the page documents. The fixture showcase the
# tool's own tests run lives beside its fixtures, in
# test/docevals/fixtures/pages/manni.config.yaml.
docevals:
  defaults:
    # Pages name their own suite. A page with none runs only its own evals.
    suite: null
    failFast: false
    concurrency: 4

  # Named rather than detected, so a judged run behaves the same on every
  # machine. No model is pinned: the inference library's default for the
  # provider is used, and every cache key names the model it resolved to.
  # Under docevals: rather than a top-level providers: map, because that map
  # is every tool's default and the metadata tool's fill tests expect
  # detection.
  provider: anthropic

  judge:
    ensembleRuns: 3
    temperature: 0
    zones:
      autoPass: 0.8
      autoFail: 0.8
    falsePositiveAlert: 0.15
    # Below the family cache directory, which .gitignore excludes.
    cacheDir: .manni/docevals/cache
    maxTurns: 600

  fill:
    cacheDir: .manni/docevals/cache/fill
    maxTurns: 200

  # Nothing on this site runs content-authored commands. The docs-as-tests
  # workflow runs the pages' inline steps.
  execution:
    allow: []

  evals:
    # Deterministic, so `npm run docs:check-docevals` grades it offline.
    no-todo-markers:
      assertion: The page carries no TODO, TBD or FIXME markers.
      grader: tool:regex
      options:
        pattern: "\b(TODO|TBD|FIXME)\b"
        match: not-contains
      severity: error
    # Judged, so a deterministic run skips it. Named for `--eval` and for
    # pages that `use:` it.
    no-future-promises:
      type: regression
      assertion: The page makes no claims about unreleased or future functionality.
      grader: ai
      evidence: All prose sections
      examples:
        pass: Describes only shipped behavior.
        fail: Says "coming soon" or references an unreleased version.

  # One suite per domain, named by the pages' `eval-suite:`. Each page's own
  # capability evals report under its suite beside `no-todo-markers`. A
  # skipped eval does not count toward the rate, so a deterministic run
  # measures the regex alone.
  suites:
    a11y: { target-pass-rate: 1.0, evals: [no-todo-markers] }
    cite: { target-pass-rate: 1.0, evals: [no-todo-markers] }
    docevals: { target-pass-rate: 1.0, evals: [no-todo-markers] }
    graph: { target-pass-rate: 1.0, evals: [no-todo-markers] }
    key: { target-pass-rate: 1.0, evals: [no-todo-markers] }
    lint: { target-pass-rate: 1.0, evals: [no-todo-markers] }
    manni: { target-pass-rate: 1.0, evals: [no-todo-markers] }
    meta: { target-pass-rate: 1.0, evals: [no-todo-markers] }
    term: { target-pass-rate: 1.0, evals: [no-todo-markers] }
    tracevals: { target-pass-rate: 1.0, evals: [no-todo-markers] }
