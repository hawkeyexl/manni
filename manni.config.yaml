# manni validating its own docs.
#
# This file exists so the config-discovery path — the one most users actually
# hit, and the subject of docs/proposals/0004 — is exercised by the project on
# itself, rather than only by unit tests against temp directories. CI used to
# spell the schema out on the command line; a bare `manni meta validate` at the
# repo root now reaches the same verdict.
#
# One file for the whole family, one top-level key per tool (proposal 0033),
# plus the one key that is nobody's: `collections:` declares the document sets
# every tool reads (proposal 0041). The metadata tool reads `collections:` and
# `meta:`, so a sibling tool's section can sit beside them without either
# reading the other's keys.
#
# It is deliberately narrow, because a config at the repo root is discovered by
# *every* manni run anywhere beneath it — including this repo's own test
# suite. Every key here is ambient behaviour for all of them, so there are only
# two.
#
# In particular the docs schema hangs off `overrides:` rather than top-level
# `schemas:`. `schemas:` is the default set applied to **every** validated file,
# not only the collection's members, so putting it there would judge a fixture
# under `test/` against the docs frontmatter contract. An override applies only
# to the files it governs; everything else keeps DEFAULT_SCHEMAS.

# What a bare `manni meta validate` checks: the published docs pages. Named
# `site` rather than `docs`, which `collections:` refuses — `docs` is the table
# every `manni meta query` reads, and a view of that name would shadow it.
# The citation tool reads it too: a bare `manni cite check` checks these same
# pages against this checkout, and every other cite key is a default, so it
# needs no section of its own.
collections:
  - name: site
    paths:
      - "docs/src/content/docs/**/*.{md,mdx}"
    # Where those pages are published, and so what `manni a11y check` checks
    # when it is given no URLs of its own (proposal 0041, rule 12). It is the
    # local preview rather than the deployed site, because the point of the
    # check is the build a pull request produces, before it deploys. To run it
    # by hand: `cd docs && npm run build && npx astro preview --host 127.0.0.1
    # --port 4321`, then `manni a11y check` from anywhere in the repo. The Docs
    # workflow's `a11y` job runs exactly that. To check the live site instead,
    # name it: `manni a11y check https://hawkeyexl.github.io/manni/`.
    #
    # It is not `a11y.urls` because it is a fact about where this collection
    # of documents lives, not a setting of the accessibility tool — the whole
    # reason a collection is declared once for every tool to read.
    url: http://127.0.0.1:4321/manni/

meta:
  # Every published page must declare a non-empty title and description. Scoped
  # to the `site` collection, so it governs the docs and nothing else.
  overrides:
    - collection: site
      schemas:
        - ./docs/doc-frontmatter.schema.json
        # The platform contract this site actually runs on. The house schema
        # above stays because Starlight itself does not require `description`
        # and this site does; what the built-in adds is everything the house
        # schema left unconstrained — `sidebar.order` must be a number,
        # `template` must be `doc` or `splash`, a `badge` object must carry
        # `text`. Before it existed, every Starlight key on every page went
        # unchecked.
        - astro:starlight:0.41

# The accessibility tool reads `a11y:` and nothing else. Same narrowness as
# above, for the same reason: this file is ambient for every run beneath the
# repo, the test suite included. The a11y CLI tests therefore run from a temp
# directory outside the repo, where discovery finds nothing, so the keys here
# never reach them. Every key is a default a flag on the command line beats.
#
# It carries no `urls:`. The seeds come from the `site` collection's `url:`
# above, which is the fallback a11y uses when nothing is named on the command
# line and this section sets no urls of its own.
a11y:
  # The project's floor: findings below it are dropped before the score and
  # the exit code are decided. The values are the family scale every manni
  # tool shares, `notice | warning | error`; axe's four impact levels are
  # mapped onto it, `critical` and `serious` both landing as `error`.
  # `--severity <level>` on the command line wins. The built-in default is
  # `notice`, everything axe reports, and the floor sits there now that the
  # site carries no finding at any level. It is a ratchet: lower it as
  # findings are fixed, never raise it.
  severity: notice

# The docevals tool validating its own fixture corpus (the dogfood for
# `manni docevals run`). Its own key, its own settings; the metadata tool
# above never reads them. Carried over from moose-docevals with the fixture
# paths moved under test/docevals/.
#
# The corpus is named on the command line, `manni docevals run
# test/docevals/fixtures/pages`, rather than declared as a collection:
# a bare `manni meta validate` and `manni cite check` read every collection
# this file declares, and the fixture pages are not docs pages.
docevals:
  defaults:
    suite: null
    failFast: false
    concurrency: 4

  # Named rather than detected, so a run over the fixtures behaves the same on
  # every machine: without ANTHROPIC_API_KEY it degrades to deterministic evals
  # instead of picking up whatever this machine happens to have (the Claude CLI,
  # a local model). No model is pinned; the inference library's default for the
  # provider is used, and every cache key names the model it resolved to.
  provider: anthropic

  judge:
    ensembleRuns: 3
    temperature: 0
    zones:
      autoPass: 0.8
      autoFail: 0.8
    falsePositiveAlert: 0.15
    cacheDir: .manni/docevals/cache

  # The fixture corpus declares command evals in page frontmatter
  # (installation.mdx, find.mdx), so this run grants that capability. It does
  # NOT grant page-embedded-steps: nothing here runs doc-detective.
  execution:
    allow: [frontmatter-commands]

  scripts:
    dir: "{docDir}/manni-docevals"
    configDir: manni-docevals-scripts
    timeoutMs: 30000

  evals:
    no-future-promises:
      type: regression
      assertion: The page makes no claims about unreleased or future functionality.
      grader: ai
      evidence: All prose sections
      examples:
        pass: Describes only shipped behavior.
        fail: Says "coming soon" or references an unreleased version.
    explains-why-before-how:
      type: capability
      assertion: >
        The page explains why a reader would use the feature before explaining
        how to use it.
      grader: ai
      evidence: Introduction and first section
      examples:
        pass: Opens with the problem the feature solves, then gives steps.
        fail: Jumps straight into syntax with no motivation.
    frontmatter-valid:
      assertion: Page frontmatter validates against the docevals built-in schema.
      grader: tool:docmeta
      options:
        schemas: ["schemas/docevals/frontmatter-1.0.0.json"]
      severity: error
    remark:
      assertion: Page parses as MDX and passes remark lint rules.
      grader: tool:remark
      severity: warning
    names-an-action:
      # The cheap rung below the judge: a verifiable fact, matched rather than
      # argued about three times.
      assertion: The page documents at least one Doc Detective action.
      grader: tool:regex
      options:
        pattern: "(goTo|find|click|checkLink|httpRequest)"
      severity: warning
      # Secondary to the judged assertions on the same page: it is a spec
      # literal, so it reports without dominating the suite's rate.
      weight: 0.5
    ships-a-schema:
      assertion: The actions corpus still ships the schema files it references.
      grader: tool:file-exists
      options:
        path: "*.mdx"
      severity: notice
    fresh-enough:
      assertion: Page was reviewed within the last year.
      grader: tool:freshness
      options:
        field: last-reviewed
        max-age-days: 365
      severity: warning
    readable:
      assertion: Page prose reads below grade 12.
      grader: tool:reading-level
      options:
        max-grade: 12
      severity: warning
    distinct-action-pages:
      assertion: >
        Action reference pages describe behaviors unique to their action,
        distinct from related actions.
      grader: tool:differentiation
      options:
        scope: "test/docevals/fixtures/pages/docs/actions/**"
        max-similarity: 0.85
      severity: error

  criteria:
    # Two checks that only mean something together: a page claiming to
    # document an action should both name it and be fresh enough to trust.
    # Scored once, so the pair cannot outvote a standalone eval.
    action-page-is-trustworthy:
      evals: [names-an-action, fresh-enough]
      combine: all
      weight: 2

  suites:
    reference:
      target-pass-rate: 1.0
      evals: [no-future-promises, fresh-enough, readable, frontmatter-valid, names-an-action, ships-a-schema]
      criteria: [action-page-is-trustworthy]
    tutorial:
      target-pass-rate: 0.7
      evals: [explains-why-before-how, no-future-promises]
    how-to:
      target-pass-rate: 1.0
      evals: [no-future-promises, readable]
