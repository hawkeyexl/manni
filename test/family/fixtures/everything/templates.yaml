# The lint templates the everything fixture routes by: a term page has no
# heading, a concept holds a paragraph, and a strategy record has no shape
# of its own to keep.
templates:
  term:
    types: [term]
    heading: false
  record:
    types: [audience, persona, journey]
  concept:
    types: [concept]
    contains:
      paragraphs:
        min: 1
