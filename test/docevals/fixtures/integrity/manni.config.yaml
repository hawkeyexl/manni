# Two pages under two evals each, so a run reports two results per page.
# The pages differ in content, so their integrities differ.
collections:
  - name: site
    paths:
      - "docs/**/*.md"

docevals:
  evals:
    no-todo-markers:
      grader: tool:regex
      options:
        pattern: "\\b(TODO|TBD|FIXME)\\b"
        match: not-contains
    no-lorem:
      grader: tool:regex
      options:
        pattern: "lorem"
        match: not-contains

  suites:
    reference:
      target-pass-rate: 1.0
      evals: [no-todo-markers, no-lorem]
