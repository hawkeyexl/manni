# docevals reading its document set from the family `collections:` list
# (proposal 0041). Two collections, so selection has something to narrow:
# `guides` is a glob with an `exclude:`, `blog` is a bare directory.
# `outside/` belongs to neither, so only a typed path reaches it.
collections:
  - name: guides
    paths:
      - "docs/**/*.md"
    exclude:
      - "docs/drafts/**"
  - name: blog
    paths:
      - "blog"

docevals:
  defaults:
    suite: default

  evals:
    no-todo-markers:
      assertion: The page carries no TODO, TBD or FIXME markers.
      grader: tool:regex
      options:
        pattern: "\\b(TODO|TBD|FIXME)\\b"
        match: not-contains
      severity: error

  suites:
    default:
      target-pass-rate: 1.0
      evals: [no-todo-markers]
