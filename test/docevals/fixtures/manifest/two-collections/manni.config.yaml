# Two collections hold the same page, and each keeps `evals` in a manifest of
# its own. There is no tiebreak to pick: the run is refused.
collections:
  - name: site
    paths:
      - "docs/**/*.md"
    externalMetadata:
      - file: ./site.metadata.yaml
        keys: [evals]
  - name: guides
    paths:
      - "docs/**/*.md"
    externalMetadata:
      - file: ./guides.metadata.yaml
        keys: [evals]

docevals:
  evals:
    no-todo-markers:
      assertion: The page carries no TODO, TBD or FIXME markers.
      grader: tool:regex
      options:
        pattern: "\\b(TODO|TBD|FIXME)\\b"
        match: not-contains
      severity: error
