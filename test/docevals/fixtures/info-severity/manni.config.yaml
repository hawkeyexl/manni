# An eval at `severity: info`, the scale docevals was imported with. The
# family scale is notice | warning | error, so this is a schema error.
docevals:
  evals:
    no-todo-markers:
      assertion: The page carries no TODO, TBD or FIXME markers.
      grader: tool:regex
      options:
        pattern: "\\b(TODO|TBD|FIXME)\\b"
        match: not-contains
      severity: info
