# The x-manni-graph-output fixture (proposal 0051 §5). The house schema beside
# this file is what carries the marks; `schemas` is how graph is told which schema
# set the marks are read from.
collections:
  - name: graph-output
    paths:
      - "docs/**/*.md"

graph:
  baseIri: https://example.com/graph/
  out: graph.ttl
  schemas: ["./no-people-in-the-graph.schema.json"]
