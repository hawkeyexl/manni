# The x-manni-graph-output fixture (proposal 0051 §5). The house schema beside
# this file is what carries the marks. graph build reads them from the schema
# set `manni meta validate` resolves (proposal 0074), so the house schema is
# listed under meta:, where it joins the default set.
collections:
  - name: graph-output
    paths:
      - "docs/**/*.md"

meta:
  schemas: ["./no-people-in-the-graph.schema.json"]

graph:
  baseIri: https://example.com/graph/
  out: graph.ttl
