<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Upload guide</title>
    <meta name="description" content="Send uploads and retry them.">
    <meta name="sample-questions" content="[{question: How many times does an upload retry by default?, answers: [{lines: 15, integrity: sha256-7a51f145a84db25a2f55e9b0543c5b340434ceafbe524a8507986e1c2261ac83}]}, {question: How do I resume a paused upload?, answers: [{lines: 16, integrity: sha256-28798612a8161aff683a78ccbd95b7a18301233640e8064f9e66be4acde0c475}]}]">
  </head>
  <body>
    <section id="retry">
      <h2>Retry a failed upload</h2>
      <p>Open the upload list and choose retry. How many times you retry is up to you and an upload can retry by default.</p>
    </section>
    <section id="limits">
      <h2>Retry limits</h2>
      <p>The client tries three more times and waits longer each time.</p>
    </section>
    <section id="resume">
      <h2>Resume a paused upload</h2>
      <p>Choose resume to continue a paused upload where it stopped.</p>
    </section>
  </body>
