# The cross-page fixture (proposal 0087). One golden-set question needs two
# pages, and each answer must be found. `top: 1` keeps the corpus small.
collections:
  - name: questions
    paths:
      - "docs/**/*.*"

graph:
  baseIri: https://example.com/graph/
  out: graph.ttl
  questionFiles: [questions.yaml]
  build:
    derive: [frontmatter, sections]
  check:
    questions:
      top: 1
