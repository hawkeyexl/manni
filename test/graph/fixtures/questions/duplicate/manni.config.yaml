# The duplicate fixture (proposal 0087). One question is asked on two pages and
# in the golden-set file, spelled three ways. `top: 1` keeps the corpus small.
collections:
  - name: questions
    paths:
      - "docs/**/*.*"

graph:
  baseIri: https://example.com/graph/
  out: graph.ttl
  questionFiles: [questions.yaml]
  build:
    derive: [frontmatter, sections]
  check:
    questions:
      top: 1
