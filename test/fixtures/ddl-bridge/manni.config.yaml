# House schema for the DDL type-bridge tests (0028).
collections:
  - name: pages
    paths:
      - "docs/**/*.md"

meta:
  # The DDL tests evolve one schema, and DDL refuses a key two schemas in
  # the set constrain. The default set (proposal 0070) declares `title`,
  # `tags` and more, so these fixtures keep the exact set they name.
  defaults: false
  schemas:
    - ./schemas/house.json
