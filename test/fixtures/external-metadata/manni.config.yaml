# External-metadata fixture (proposal 0037, moved under `collections:` by
# 0041): the private half of a public docset.
collections:
  - name: pages
    paths:
      - "docs/**/*.md"
    externalMetadata:
      - file: ./docs-meta.yaml
        keys: [source, jira]

meta:
  overrides:
    - collection: pages
      schemas:
        - ./private.schema.json
