# Every `cite:` key, once, so a test can prove each one round-trips. The
# document set is the family's `collections:` list (proposal 0041), which the
# citation tool reads as every tool does. The sibling `meta:` section is here
# to show the tool reads its own key only.
collections:
  - name: pages
    paths: ["pages/**/*.md", "guides/*.mdx"]
    exclude: ["**/drafts/**"]
meta:
  schemas: ["./docs.schema.json"]
cite:
  allowEmpty: true
  respectGitignore: false
  root: ../src
  baseline: .cite-baseline.json
  git: false
  sources: false
  salt: fixture-salt
  severity:
    moved: error
    changed: warning
    current: off
