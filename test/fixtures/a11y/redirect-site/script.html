<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scripted page</title>
    <script>
      addEventListener("load", () => setTimeout(() => location.replace("/new.html"), 0));
    </script>
  </head>
  <body>
    <main>
      <h1>Scripted page</h1>
      <p>Sends the browser to the new page once it has loaded.</p>
    </main>
  </body>
</html>
