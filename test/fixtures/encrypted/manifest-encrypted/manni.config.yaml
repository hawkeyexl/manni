# A private manifest supplies the marked key as a ciphertext (proposals 0037
# and 0045): a manifest-supplied encrypted value follows the same rules as one
# the page holds. Only a *plain* manifest value is exempt, which
# ../manifest/ covers.
collections:
  - name: pages
    paths:
      - "docs/**/*.md"
    externalMetadata:
      - file: ./owners.yaml
        keys: [owner]

meta:
  overrides:
    - collection: pages
      schemas:
        - ../encrypted.schema.json
