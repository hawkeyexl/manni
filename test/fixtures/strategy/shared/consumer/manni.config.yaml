# Borrows ../owner's records, and owns one journey, p1. `strategy check`
# files no finding in ../owner, and counts its records as borrowed.
collections:
  - name: site
    paths: ["docs/**/*.md"]
  - name: strategy
    paths:
      - ../owner/audiences/
      - ../owner/personas/
      - ../owner/journeys/
      - strategy/journeys/

meta:
  defaults: false
  schemas: [manni:core:1.0.0]
  overrides:
    - files: "strategy/journeys/*.md"
      schemas: [../owner/schemas/journey.schema.json]
