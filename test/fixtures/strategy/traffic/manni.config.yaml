# A docset laid out like this repository's, so docs/content-strategy/traffic.sql
# runs over it unedited. It exercises the index route, the query-string fold,
# a bare-string personas:, an unplanned page and an unmatched URL.
collections:
  - name: site
    paths:
      - "docs/src/content/docs/**/*.md"
  - name: strategy
    paths:
      - "strategy/**/*.md"
