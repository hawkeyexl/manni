# A corpus for `manni meta derive`: two pages, a CODEOWNERS file, and three
# managed fields. The tests copy it into a temp repository and commit it with
# pinned dates, so the facts under test are the commits', not the clock's.
collections:
  - name: site
    paths:
      - "docs/**/*.md"

meta:
  schemas:
    - ./permissive.schema.json
  derive:
    fields: [created, last-updated, owner]
