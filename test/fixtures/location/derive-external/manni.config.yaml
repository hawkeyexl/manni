# derive (0047): owner prefers external metadata and no manifest owns it.
# defaults: false keeps the judged set to steward.schema.json, whose marks
# are the subject; the default stewardship vocabulary marks created too.
collections:
  - name: site
    paths: ["docs/**/*.md"]
    # An empty list opts out of the metadata directory (proposal 0126), so
    # the offer is a manifest of the collection's own (0047 section 3).
    externalMetadata: []
meta:
  defaults: false
  schemas: [./steward.schema.json]
  derive:
    fields: [created, owner]
    sources: [git, codeowners]
