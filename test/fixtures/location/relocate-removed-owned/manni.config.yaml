# defaults: false keeps the other pages unmarked; the default set's core
# vocabulary would mark title page on every page.
meta:
  defaults: false
  schemas: [./plain.schema.json]
  overrides:
    - files: "docs/a.md"
      schemas: [./marked.schema.json]
collections:
  - name: site
    paths: ["docs/**"]
    externalMetadata:
      - file: ./docs-meta.yaml
        keys: [title, team]
