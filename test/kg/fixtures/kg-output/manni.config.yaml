# The x-manni-kg-output fixture (proposal 0051 §5). The house schema beside
# this file is what carries the marks; `validate.schemas` is how kg is told
# which schema set the marks are read from.
collections:
  - name: kg-output
    paths:
      - "docs/**/*.md"

kg:
  baseIri: https://example.com/kg/
  out: graph.ttl
  validate:
    schemas: ["./no-people-in-the-graph.schema.json"]
