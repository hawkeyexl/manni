# A document that fails the frontmatter JSON Schema, so the fix page can show a
# real `manni meta validate` failure against the graph page vocabulary. Collection
# paths resolve from this file's directory; see the note in docs.config.yaml
# beside it.
collections:
  - name: invalid
    paths:
      - "invalid/**/*.md"

kg:
  baseIri: https://example.com/dd/
  out: .tmp/dd/invalid.ttl
