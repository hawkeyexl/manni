# A two-locale corpus for the localization page's inline tests (ADR 01037): an
# English tree, a German one that inherits its language from the route, and a
# page that overrides the route with its own `lang`.
collections:
  - name: l10n
    paths:
      - "l10n/**/*.md"

kg:
  baseIri: https://example.com/dd/
  out: .tmp/dd/l10n.ttl
  # Routes map published paths back to source files, so they stay
  # repo-root-relative: they are matched against the document paths the run
  # produced, which are relative to the working directory.
  routes:
    - root: test/kg/fixtures/dd/l10n/en
      basePath: /
      language: en
    - root: test/kg/fixtures/dd/l10n/de
      basePath: /de
      language: de
