# Corpus for the unenforceable-cost-cap message on build/backfill.mdx
# (ADR 01027). The model name is deliberately absent from the price table, so
# `fill` cannot total spend and must say the cap does not apply rather than
# reporting a confident $0.0000.
#
# Separate from dockg.config.yaml so this fill.* block does not perturb the
# counts the get-started steps assert.
collections:
  - name: unpriced
    paths:
      - "unpriced/**/*.md"

kg:
  baseIri: https://example.com/dd/
  out: .tmp/dd/unpriced.ttl
  fill:
    provider: mock
    model: no-such-model-in-the-price-table
    maxCostUsd: 5
