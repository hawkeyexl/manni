# Corpus for the turn-budget message on the fill docs page.
#
# It used to demonstrate the unenforceable-cost-cap warning (kg ADR 01027):
# the model name is deliberately absent from the inference library's price
# table, so nothing could be totalled and a 5 USD cap could not be applied.
# Proposal 0051 §3 removed the dollar and counts turns instead, which every
# model can be counted making — so what this corpus now shows is a page the
# budget skipped, and the reason printed beside it.
#
# Separate from dockg.config.yaml so this fill.* block does not perturb the
# counts the get-started steps assert.
collections:
  - name: unpriced
    paths:
      - "unpriced/**/*.md"

kg:
  baseIri: https://example.com/dd/
  out: .tmp/dd/unpriced.ttl
  provider: mock
  model: no-such-model-in-the-price-table
  fill:
    maxTurns: 1
