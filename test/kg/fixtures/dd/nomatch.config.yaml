# A collection whose paths match nothing, so the docs can prove that "no input
# files matched" is an operational error (exit 2) rather than an empty
# successful build. This is the failure a reader hits when they run manni kg
# from the wrong directory.
collections:
  - name: nomatch
    paths:
      - "docs/**/*.rst"

kg:
  baseIri: https://example.com/dd/
  out: .tmp/dd/nomatch.ttl
