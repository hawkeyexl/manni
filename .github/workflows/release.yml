# Release pipeline. On every push to a release branch, semantic-release reads
# the conventional commits since the last tag, computes the next version, and
# (when warranted) updates CHANGELOG/package.json, tags, creates a GitHub
# Release, and publishes to npm.
#
#   main      -> @latest
#   next      -> @next prerelease
#   feat/**   -> per-branch prerelease channel
#
# Publishes to npm via OIDC trusted publishing (https://docs.npmjs.com/trusted-publishers):
# no NPM_TOKEN secret. npm exchanges the workflow's OIDC token for a short-lived,
# scoped publish credential, so the `id-token: write` permission below is what
# authorizes the publish (and mints provenance automatically). The trusted
# publisher configured on npmjs.com must name this workflow file (release.yml).
#
# The release commit (CHANGELOG/package.json bump), tag, and GitHub Release are
# pushed/created using a GitHub App token, NOT the default GITHUB_TOKEN. `main`
# has a ruleset requiring all changes via PR, and the default token can't bypass
# it, so @semantic-release/git's direct push is rejected (GH013). The App is
# added as the sole bypass actor on that ruleset; its short-lived token is what
# lets the release commit land. Requires two secrets — RELEASE_APP_ID and
# RELEASE_APP_PRIVATE_KEY — and the App installed with Contents/Issues/Pull
# requests: read & write. See docs/maintainers/releasing.md for the one-time setup.
#
# Requires npm CLI >= 11.5.1 and @semantic-release/npm >= 13 (Node 24 bundles a
# new enough npm). Do NOT set setup-node's registry-url or any NPM_TOKEN /
# NODE_AUTH_TOKEN: a written-out auth token in .npmrc shadows OIDC and breaks it.
name: Release

on:
  push:
    branches:
      - main
      - next
      - "feat/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # OIDC trusted publishing to npm + provenance (public package)

jobs:
  release:
    # Don't re-release semantic-release's own release commit.
    #
    # This used to be `[skip ci]` in the commit message (`.releaserc.json`),
    # which worked on that commit and silently broke every squash merge. GitHub
    # honours the marker anywhere in the pushed commit's message, and a squash
    # concatenates the branch's commit messages — so a `feat/**` branch, which
    # accumulates `chore(release): ...-<branch>.N [skip ci]` prerelease commits
    # by design, carried the marker into `main` and skipped Release and Docs
    # both. Seven of the eight merges before this one released nothing at merge
    # time; 4.0.0 shipped only because #103 happened to be the one branch with
    # no prerelease commits, and swept up everything behind it.
    #
    # Matching on the subject alone is what makes the difference: a real release
    # commit *starts* with the prefix, while an inherited marker is buried in a
    # squash body. `test/release-config.test.ts` pins this string to the message
    # template it has to match.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The husky commit-msg hook isn't useful in CI, and semantic-release's
    # release commit embeds the full changelog (long lines). Disable husky.
    env:
      HUSKY: "0"
    steps:
      # Mint a short-lived token for the App that's whitelisted to bypass the
      # `main` ruleset, so semantic-release can push the release commit.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Captured before the release so the tag-move below can tell "released"
      # from "ran and found nothing to release" — a push to `main` with only
      # `chore:`/`docs:` commits does the latter, and moving the major tag then
      # would aim it at a tree that was never published.
      - id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          # App token (not the default GITHUB_TOKEN): semantic-release uses it both
          # to push the release commit/tag past the main ruleset and for the GitHub
          # Release + issue/PR comments. No NPM_TOKEN/NODE_AUTH_TOKEN: the npm
          # publish authenticates via OIDC trusted publishing (id-token above).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release

      # Action consumers write `uses: hawkeyexl/manni@vN` and expect it to
      # track the newest release of that major. That only works because someone
      # force-updates the `vN` tag; semantic-release creates immutable `vN.N.N`
      # tags and nothing else, so without this step the reference resolves to
      # nothing.
      #
      # It runs unless the job was cancelled, not only when Release succeeded.
      # The 2.0.0 release published to npm, pushed `v2.0.0` and created the
      # GitHub release, then failed in a post-publish plugin step; gated on
      # success, this step was skipped and `v2` was never created. Running after
      # a failure means the step can no longer assume a release happened, so it
      # proves it, and each gate below closes one way of aiming the tag at a
      # tree nobody can install:
      #
      # - `before` recorded a version. A failure before that step leaves it
      #   empty, which would otherwise read as "the version changed".
      # - The version changed. A push with only `chore:`/`docs:` commits runs
      #   this job and releases nothing.
      # - It is not a prerelease. `.releaserc.json` gives `next` and `feat/**`
      #   prerelease identifiers, which must never claim the major tag.
      # - npm serves exactly that version. semantic-release bumps package.json
      #   in `prepare`, before `publish`, so a failed publish still changes the
      #   version. The printed version is compared rather than the exit status
      #   trusted, because older npm exits 0 with no output for a missing
      #   version. Retried briefly, for the registry catching up after publish.
      # - The `v$version` tag is on the remote. The major tag is moved to that
      #   tag, so a release that failed before pushing it has nothing to aim at.
      #
      # A release that changed the version but fails one of the last two gates
      # is a half-published release, so the step fails loudly rather than
      # skipping quietly.
      #
      # The token is passed explicitly because `checkout` above sets
      # `persist-credentials: false`: the job holds `contents: write`, but no
      # credential is in git's config, and this App is also the only actor
      # allowed to bypass the `main` ruleset.
      - name: Move the major tag
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Through the environment, not `${{ }}`. `action.yml` documents why:
          # `${{ }}` is substituted textually before bash parses the line, so
          # the value is code rather than data. It reaches `main` only through
          # a merge, which makes this narrow — but this is the job holding the
          # App token, npm publish rights, and a ruleset bypass, so it is the
          # last place to make an exception.
          VERSION_BEFORE: ${{ steps.before.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION_BEFORE" ]; then
            echo "::notice::The release never recorded a starting version; leaving the major tag alone."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "$VERSION_BEFORE" ]; then
            echo "::notice::No release was produced; leaving the major tag alone."
            exit 0
          fi
          case "$version" in
            *-*)
              echo "::notice::$version is a prerelease; leaving the major tag alone."
              exit 0
              ;;
          esac
          name="$(node -p "require('./package.json').name")"
          served=""
          for attempt in 1 2 3 4 5; do
            served="$(npm view "$name@$version" version 2>/dev/null || true)"
            if [ "$served" = "$version" ]; then break; fi
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          if [ "$served" != "$version" ]; then
            echo "::error::package.json says $version, but npm does not serve $name@$version; leaving the major tag alone. The release is half-published."
            exit 1
          fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --tags "$remote" "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::npm serves $name@$version, but the remote has no v$version tag; leaving the major tag alone. The release is half-published."
            exit 1
          fi
          major="v${version%%.*}"
          # Anchored to the concrete version tag semantic-release just created,
          # not to HEAD: semantic-release commits the changelog and version bump
          # itself, so HEAD here is not necessarily what it tagged.
          echo "Moving $major to v$version"
          git tag -f "$major" "v$version"
          git push --force "$remote" "refs/tags/${major}"
