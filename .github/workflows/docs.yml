name: Docs

# Build the Starlight docs site and publish it to GitHub Pages on every push to
# main. The deploy is gated on manni validating its own docs frontmatter
# (dogfooding): if a page is missing a required field, the site does not ship.
#
# Pull requests run the same validate and build, and stop there. `ci.yml`
# already runs the dogfood on PRs — the frontmatter half was covered — but the
# **Astro build** only ever ran on main, so a PR could break the site itself
# (a bad MDX import, a component that no longer exists, a broken `<LinkCard>`)
# and fail only after merge, with nothing left to review. That is the same
# shape as #52, one level up: a gate that runs after the decision instead of
# before it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. `pages: write` and the OIDC token belong to the one job that
# deploys, not to the workflow — pull requests run here now, and a token that
# can publish Pages has no business existing in a run whose whole purpose is to
# check that the site builds.
permissions:
  contents: read

# Only one Pages deploy at a time; let an in-flight run finish rather than
# cancelling it (avoids leaving Pages in a half-deployed state).
#
# Keyed by ref rather than a bare `pages` since PRs run here too. A shared group
# would make every PR queue behind main's deploy and behind each other, for runs
# that never deploy anything. Pushes to main all share `refs/heads/main`, so the
# serialization the deploy actually needs is unchanged.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Dogfood: build the manni CLI from this repo and use it to validate the
  # frontmatter of the docs pages. The targets and the schema both come from the
  # repo's own manni.config.yaml, whose `overrides:` entry points the docs glob
  # at a docs-specific schema requiring title + description — rather than the
  # default OKF set, which requires `type` and no page carries.
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check CLI reference is in sync with src/meta/cli.ts
        run: npm run docs:check-cli
      # Bare, with no paths and no `-s`: both come from the repo's own
      # manni.config.yaml, so the deploy gate exercises config discovery
      # rather than stepping around it. Kept identical to the step in ci.yml.
      - name: Validate docs frontmatter (dogfood)
        run: node dist/cli.js meta validate --format github

  # Build the Astro/Starlight static site and upload it as a Pages artifact.
  #
  # Runs on pull requests too, where it is the point of the run: this is the
  # only place the site is actually built before merge. The artifact upload is
  # skipped there, since nothing downstream consumes it.
  build:
    needs: validate-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        run: npm ci
        working-directory: docs
      - name: Build docs site
        run: npm run build
        working-directory: docs

      # Reads the rendered HTML, so it has to follow the build. It catches the
      # quiet half of a broken link: an href whose page exists but whose anchor
      # does not, which resolves without a 404 and drops the reader at the top
      # of the page. Two of those had been live for months — `#json` on the
      # output reference, and a `#schematrust` that should have been
      # `#schema-trust` — because nothing looked.
      - name: Check internal links and anchors resolve
        run: npm run docs:check-links
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  # Dogfood the second domain: build the manni CLI from this repo, build the
  # docs site, serve it locally, and run `manni a11y check` over it. Same shape
  # as `validate-docs`, one level up: the tool under test checks the site the
  # repo publishes. It runs on pull requests so a page that ships a new finding
  # is annotated before merge, and on main so the live site keeps a record.
  # The check steps name no URL: it comes from the `a11y:` key of the repo's
  # own manni.config.yaml, so the job exercises config discovery the way
  # `validate-docs` does for the metadata tool.
  #
  # Nothing downstream depends on it. The deploy is gated on frontmatter and on
  # the site building, not on this job, so a rule that only a Starlight change
  # can satisfy does not hold the site hostage.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - run: npm ci
      # The CLI under test, from this checkout rather than npm.
      - run: npm run build
      - name: Install docs dependencies
        run: npm ci
        working-directory: docs
      - name: Build docs site
        run: npm run build
        working-directory: docs

      # `astro preview` serves docs/dist under the site's `base`, so the
      # pages answer at /manni/ the way they do on Pages. It stays up for the
      # rest of the job; the runner tears it down with the job.
      - name: Serve the built site
        run: npx astro preview --host 127.0.0.1 --port 4321 > ../preview.log 2>&1 &
        working-directory: docs
      - name: Wait for the preview to answer
        run: |
          tries=0
          until curl -fsS http://127.0.0.1:4321/manni/ > /dev/null; do
            tries=$((tries + 1))
            [ "$tries" -lt 60 ] || { echo "preview did not answer" >&2; cat preview.log >&2; exit 1; }
            sleep 1
          done

      # Two steps, one crawl each, because the report and the gate want
      # different floors. The first runs at `notice`, the bottom of the family
      # scale, so every finding the site carries lands as an annotation at
      # GitHub's matching level: `error`, `warning` or `notice`, one-to-one,
      # since the scale was chosen to match GitHub's. The step is allowed to
      # fail, because any finding at all exits 1 and the verdict is the next
      # step's.
      #
      # On localhost the built sitemap lists the production URLs, which are on
      # another host, so the crawl drops them and reaches every page through
      # the sidebar links instead. `--progress` names each page in the log,
      # which has no terminal to draw the status line on.
      - name: Report accessibility findings
        run: node dist/cli.js a11y check --severity notice -f github --progress
        continue-on-error: true

      # The gate names no floor, so it inherits `severity:` from the repo's
      # manni.config.yaml, and fails on any finding at that level. The floor
      # is `notice` now, so the gate and the report see the same findings.
      # Two rules used to keep it higher, and both are fixed in the site.
      # `scrollable-region-focusable`, axe's `serious` and so an `error`, by
      # the Expressive Code plugin in docs/astro.config.mjs that gives every
      # code block a tabindex. `landmark-unique`, axe's `moderate` and so a
      # `warning`, by giving every `<Aside>` on a page its own `title`:
      # Starlight uses the title as the aside's `aria-label`, and two untitled
      # asides of one type on a page share the default label. Proposal 0035
      # defers a baseline like 0001's; until one exists, the config's floor is
      # the ratchet. Lower it as findings are fixed, never raise it.
      - name: Gate on findings at the configured floor
        run: node dist/cli.js a11y check --progress -q

  # Deploy the uploaded artifact to GitHub Pages. Never from a pull request —
  # a PR build is a check, not a release, and `pages: write` on PR-triggered
  # runs is the shape that lets a fork publish over the live site.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The only job that needs more than `contents: read`.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
