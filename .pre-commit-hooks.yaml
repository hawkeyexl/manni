# Hooks this repository publishes to pre-commit consumers.
#
# `language: system`, not `node`, and that is a measured decision rather than a
# preference. A `language: node` hook installs *this repository* as a package,
# which cannot work here: `bin` points at `dist/cli.js`, `dist/` is gitignored,
# and building it needs devDependencies that pre-commit's environment does not
# install (`npx canceled due to missing packages: ["tsup@8.5.1"]`). Naming the
# published package in `additional_dependencies` does not rescue it either —
# this repo's own unbuilt `bin` is what gets linked, and the hook fails with
# "Executable `manni` not found". All three were tried against a scratch repo
# with `pre-commit try-repo` before settling here.
#
# `files` is an explicit regex rather than pre-commit's `types_or`, because
# `identify`'s tags do not map onto manni's formats: it has no tag for
# AsciiDoc or reStructuredText, and `.mdx` is often untagged. A mismatch would
# mean files silently not checked, which is the failure manni exists to
# prevent. The pattern must stay in step with `supportedExtensions()`, and
# `test/pre-commit-hook.test.ts` asserts the two agree as an exact set in both
# directions — so adding a format fails that test rather than quietly narrowing
# what the hook covers.
#
# `(?i)` because the CLI matches extensions case-insensitively; a hook that
# skipped `README.MD` would under-check the very files it was added to guard.
- id: manni-meta
  name: manni meta validate
  description: Validate document metadata against JSON Schema
  entry: npx --yes @hawkeyexl/manni@latest meta validate
  language: system
  files: '(?i)\.(adoc|asciidoc|dita|ditamap|htm|html|markdown|md|mdx|rst|xml)$'

# Stamps managed metadata before a commit, including `provenance` (proposal
# 0046): with MANNI_GENERATED_BY exported, the lines an agent wrote are
# attributed to it, so the edit and its stamp land in one commit. When derive
# changes a file, pre-commit stops the commit as it does for any formatter;
# re-stage and commit again. List it ahead of `manni-meta`. Only useful where
# the config sets `derive.fields`.
- id: manni-meta-derive
  name: manni meta derive
  description: Stamp managed metadata, including provenance, before a commit
  entry: npx --yes @hawkeyexl/manni@latest meta derive
  language: system
  files: '(?i)\.(adoc|asciidoc|dita|ditamap|htm|html|markdown|md|mdx|rst|xml)$'

# Checks the citations on the pages about to be committed (proposal 0044).
# pre-commit appends the staged paths, so the run covers those pages and no
# others, while the sources resolve from the git root as they always do.
#
# Both ends therefore come out of one working tree, and that is what makes the
# hook worth running locally. A commit that edits a cited source is judged
# against the edit, so the page that quotes it goes red in the commit that
# broke it rather than on the pull request. `--no-check-sources` would throw
# away exactly that half, so this hook does not pass it. Where the sources are
# a second checkout, a consumer sets `root:` under `cite:` instead.
#
# Findings below `error` never stop a commit, so a line that only moved is
# reported and the commit lands. `manni cite update` rewrites those.
- id: manni-cite
  name: manni cite check
  description: Check the staged pages' citations against their sources
  entry: npx --yes @hawkeyexl/manni@latest cite check
  language: system
  files: '(?i)\.(adoc|asciidoc|dita|ditamap|htm|html|markdown|md|mdx|rst|xml)$'
