# The GitHub Action consumers reference by its major tag, `uses: hawkeyexl/manni@vN`.
#
# Composite rather than a bundled JS action, deliberately. A JS action ships
# compiled JavaScript that GitHub runs directly, which means committing a built
# `dist/` and keeping it in step with every release — a second build pipeline,
# and the usual way an action ends up running last week's code. Shelling out to
# `npx @hawkeyexl/manni@<version> <command>` keeps the npm package as the single
# artifact, so there is exactly one thing to version.
#
# Nine inputs, and no more. Enumerating every CLI flag would create a second CLI
# surface with nothing like `docs:check-cli` guarding it against drift; `args`
# is the documented way to reach anything not listed here. `command` and
# `output-file` are Action plumbing, not CLI flags: one picks the words after
# `manni`, the other where its stdout goes.
name: manni
description: "Run manni in CI: every check a repository has set up, or any one manni command"
author: hawkeyexl

branding:
  icon: check-square
  color: blue

inputs:
  command:
    description: >-
      The manni command to run, as you would type it after `manni`, such as
      `check`, `meta validate` or `cite check`. Unset, the Action runs `check`,
      which runs every check this repository has set up.
    required: false
    default: check
  paths:
    description: >-
      Files, directories, or globs, passed to the command. Space-separated, or
      one per line. Use lines for any path containing a space. Unset, the
      command reads its collections from your config.
    required: false
  schema:
    description: >-
      Schema ref, one per line; each becomes its own `-s`. For commands that
      take `-s`, such as `meta validate`.
    required: false
  config:
    description: Path to a manni config file.
    required: false
  format:
    description: >-
      Output format, passed as `--format`. Set it to an empty string to pass
      no `--format`, for a command that has none.
    required: false
    default: github
  output-file:
    description: >-
      Write manni's report to this file instead of the job log. Its directory
      is created when missing. Use it with `format: sarif` to feed
      github/codeql-action/upload-sarif.
    required: false
  version:
    description: >-
      npm version range for the CLI. Defaults to `latest`, the newest published
      CLI. Set a range such as `2` to pin the CLI. Also accepts a path or
      tarball, which is how the smoke test runs the action against a local
      build.
    required: false
    default: "latest"
  args:
    description: >-
      Extra arguments appended after everything else, for anything the inputs
      above do not cover. Space-separated, or one per line. Shell quoting is not
      interpreted, so a value containing a space needs its own line.
    required: false
  node-version:
    description: Node version to set up. manni needs 24 or newer.
    required: false
    default: "24"

outputs:
  exit-code:
    description: >-
      manni's exit code. 0 clean, 1 an error-level finding, 2 the command could
      not run or was not a valid manni command. Only useful with
      `continue-on-error: true`; otherwise a non-zero code has already failed
      the job.
    value: ${{ steps.manni.outputs.exit-code }}

runs:
  using: composite
  steps:
    # Pinned to a SHA, not a floating major. `release.yml` already takes this
    # posture for the privileged job, and it matters more here: a consumer
    # writing `uses: hawkeyexl/manni@vN` inherits whatever this line resolves
    # to, with no way to audit or pin it from their side. Dependabot updates
    # composite actions, so the pin stays maintainable.
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - id: manni
      shell: bash
      env:
        # Through the environment rather than interpolated into the run script:
        # `${{ }}` is substituted before bash sees the line, so a path
        # containing a quote would otherwise be a shell injection.
        MANNI_COMMAND: ${{ inputs.command }}
        MANNI_PATHS: ${{ inputs.paths }}
        MANNI_SCHEMA: ${{ inputs.schema }}
        MANNI_CONFIG: ${{ inputs.config }}
        MANNI_FORMAT: ${{ inputs.format }}
        MANNI_OUTPUT_FILE: ${{ inputs.output-file }}
        MANNI_VERSION: ${{ inputs.version }}
        MANNI_ARGS: ${{ inputs.args }}
      run: |
        # `+e`, deliberately. GitHub runs a composite `shell: bash` step as
        # `bash --noprofile --norc -eo pipefail`, and errexit makes the
        # `code=$?` line below unreachable: a failing manni aborts the
        # script, `exit-code` is never written, and a consumer using
        # `continue-on-error: true` reads an empty string for the one result
        # they added it to see. The job still fails on a real failure — that is
        # what the explicit `exit "$code"` at the end is for.
        set +e -uo pipefail
        # Word-split the inputs below, but do NOT glob-expand them. A `paths:`
        # of `docs/**/*.md` must reach manni as that string: manni applies
        # its own extension filtering and gitignore rules, and bash expanding it
        # first would substitute the runner's view of the tree for manni's —
        # silently, and differently depending on the working directory.
        set -f

        # Split a multi-value input. A value containing a newline is taken one
        # item per line; otherwise it is word-split on whitespace, which is the
        # form the docs show and every existing consumer writes.
        #
        # The line form is not decoration: word-splitting cannot express a path
        # containing a space at all, and `schema` below already uses lines for
        # exactly that reason. Paths are far likelier to contain a space than a
        # schema ref is.
        split_input() {
          split_out=()
          [ -n "$1" ] || return 0
          case "$1" in
            *$'\n'*)
              while IFS= read -r item; do
                [ -n "$item" ] && split_out+=("$item")
              done <<< "$1"
              ;;
            *)
              # Word-split only. Quotes are NOT shell-processed, so a consumer
              # writing `--exclude "*.draft.md"` hands manni a value with the
              # quote characters still in it — and manni accepts it, excludes
              # nothing, and exits 0. Measured: that turns "4 files checked"
              # into "5 files checked" with no diagnostic at all. Silence is the
              # whole problem, so say something.
              case "$1" in
                *[\'\"]*)
                  echo "::warning::$2 contains a quote character. Quotes are not shell-processed here, so they become part of the value — put one item per line instead." >&2
                  ;;
              esac
              # shellcheck disable=SC2206
              split_out=($1)
              ;;
          esac
        }

        # The command words, split on whitespace and never shell-evaluated:
        # `$(…)` or `;` in the value reaches manni as a literal word, and
        # `set -f` above keeps a `*` from globbing. The CLI judges the words
        # with its own messages and exit 2, so nothing here second-guesses
        # them. An empty value is the default, `check`.
        # shellcheck disable=SC2206
        words=($MANNI_COMMAND)
        [ ${#words[@]} -gt 0 ] || words=(check)

        argv=()
        # `${a[@]+"${a[@]}"}`, not a bare `"${a[@]}"`, everywhere an array
        # that may be empty is expanded below.
        #
        # bash 3.2 — which is what macOS ships, and therefore what `shell: bash`
        # resolves to on a macos runner — treats expanding an *empty* array
        # under `set -u` as an unbound variable. The script aborts before it
        # reaches npx, so `exit-code` is never written and the action fails with
        # no diagnostic on every run that passes no paths. bash 4.4 fixed this,
        # which is why ubuntu and windows runners never showed it.
        #
        # The `+` form expands to nothing at all when the array is unset or
        # empty, and to the properly-quoted elements otherwise, on every bash
        # from 3.2 up.
        # Paths are positional, matching the CLI.
        split_input "$MANNI_PATHS" "paths"
        argv+=(${split_out[@]+"${split_out[@]}"})
        # One `-s` per line: a schema ref can contain spaces, so lines are the
        # only separator that cannot collide with a legitimate value. Passed
        # for any command; a verb without `-s` rejects it itself.
        if [ -n "$MANNI_SCHEMA" ]; then
          while IFS= read -r ref; do
            [ -n "$ref" ] && argv+=(-s "$ref")
          done <<< "$MANNI_SCHEMA"
        fi
        [ -n "$MANNI_CONFIG" ] && argv+=(-c "$MANNI_CONFIG")
        # An empty `format` omits the flag, for a command that has none.
        [ -n "$MANNI_FORMAT" ] && argv+=(--format "$MANNI_FORMAT")
        split_input "$MANNI_ARGS" "args"
        argv+=(${split_out[@]+"${split_out[@]}"})

        # `%q` per element, because the point of this line is to tell a
        # consumer what actually ran. Neither `${argv[*]}` nor `${argv[@]}`
        # would: echo rejoins on single spaces either way, so a path
        # containing a space logs identically to two separate paths.
        printf 'manni'
        printf ' %q' "${words[@]}"
        [ ${#argv[@]} -gt 0 ] && printf ' %q' ${argv[@]+"${argv[@]}"}
        [ -n "$MANNI_OUTPUT_FILE" ] && printf ' > %q' "$MANNI_OUTPUT_FILE"
        echo

        # stdin is `/dev/null`. On a runner stdin is never a TTY, so
        # `manni check` reads it for a Claude Code hook envelope and waits on
        # a silent pipe. The redirect gives it EOF at once, every run.
        manni=(npx --yes "@hawkeyexl/manni@${MANNI_VERSION}" "${words[@]}" ${argv[@]+"${argv[@]}"})
        if [ -n "$MANNI_OUTPUT_FILE" ]; then
          # The github format is workflow commands, which annotate only from
          # the job log. In a file they are inert text.
          if [ "$MANNI_FORMAT" = github ]; then
            echo "::warning::output-file sends the github format's workflow commands to $MANNI_OUTPUT_FILE, so no annotations appear. Pick another format to write a file." >&2
          fi
          mkdir -p "$(dirname "$MANNI_OUTPUT_FILE")"
          "${manni[@]}" < /dev/null > "$MANNI_OUTPUT_FILE"
          code=$?
          # A run that failed before printing leaves a zero-byte file, and
          # upload-sarif rejects one. Removing it lets `hashFiles()` skip the
          # upload instead.
          [ -s "$MANNI_OUTPUT_FILE" ] || rm -f "$MANNI_OUTPUT_FILE"
        else
          "${manni[@]}" < /dev/null
          code=$?
        fi
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        exit "$code"
