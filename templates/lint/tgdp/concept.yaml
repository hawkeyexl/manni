# Concept, derived from The Good Docs Project's `concept/template_concept.md`
# at release v1.6.0. The upstream Markdown is vendored at
# `test/lint/fixtures/tgdp/template_concept.md` and linted against this file, so the
# two cannot drift.
#
# Serves Diataxis's "explanation" as well as TGDP's "concept": they are the
# same shape under two names.
#
# Almost every heading in this doctype is optional - upstream marks all but
# "Use cases" with an `(Optional)` prefix - so this template mostly constrains
# *which* sections may appear and *in what order*, and says very little about
# what goes inside them. That is deliberate: a concept page is prose, and a
# minimum paragraph count per section would fail pages a reader would call
# correct.
#
# The `(\(Optional\) )?` alternative in each pattern is what lets upstream's own
# file lint clean: it ships the authoring marker in the literal heading text,
# where a real page writes just the section name.
#
# v2: the page's own body - the summary and the definition that follows it,
# which upstream deliberately leaves without a heading of its own - is the
# template's own `contains:` rather than a `title` section's. A concept page
# explains something, and explanations grow sections the published template
# never named; the trailing `min: 0` rule is what lets those through.
info:
  title: Concept (The Good Docs Project)
  version: "1.6.0"
  source: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/concept/template_concept.md

templates:
  concept:
    types:
      - concept
      - explanation
    guide: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/concept/guide_concept.md
    # The page title, whatever the author calls the concept. Its body is the
    # summary that introduces the concept and the definition that follows -
    # upstream notes the definition deliberately carries no heading of its
    # own, so it is checked here rather than in a section.
    description: >-
      Explain one concept so the reader understands what it is and how it
      fits the bigger picture. Open with a short summary, then define the
      concept.
    contains:
      paragraphs:
        min: 1
    sections:
      # Context, prehistory, or background for the concept.
      - id: background
        description: >-
          Give the history or context that helps the reader understand the
          concept, such as why it was designed the way it was.
        heading:
          pattern: '^(\(Optional\) )?Background$'
        min: 0
        max: 1
      # How a reader benefits from the concept. The one section upstream
      # does not mark optional.
      - id: use-cases
        description: >-
          Show how the concept helps the reader, starting from a real problem
          they face and how the concept solves it.
        heading: Use cases
        max: 1
      # A comparison of the options or alternatives the concept sits
      # among. Upstream titles it `Comparison of {thing being compared}`,
      # so only the literal prefix is anchored.
      - id: comparison
        description: >-
          Compare the concept with its alternatives, versions, or types, and
          say when to choose each one.
        heading:
          pattern: '^(\(Optional\) )?Comparison( of .+)?$'
        min: 0
        max: 1
      # Links out to related documentation. Upstream recommends "Related
      # concepts" or "Additional information" as more descriptive names,
      # so all three are accepted.
      - id: related-resources
        description: >-
          Link to related concepts, how-to guides, and other material for
          readers who want to go deeper.
        heading:
          pattern: '^(\(Optional\) )?(Related resources|Related concepts|Additional information)$'
        min: 0
        max: 1
      # A concept page explains something, and explanations grow sections the
      # published template never named. The four above are the ones TGDP
      # names; anything else the author needs is allowed through.
      - min: 0
        description: Add any other sections the explanation needs here, after the ones above.
    # Judged by `manni docevals` on every page routed to this template. Each
    # assertion is one a reader of the finished page can check, drawn from
    # upstream's guide at the same pin, vendored as
    # test/lint/fixtures/tgdp/guide_concept.md.
    evals:
      # guide_concept.md:71, 77, 81-82, 207
      - id: tgdp-opens-with-a-definition
        assertion: The page states what the concept is near the top, before any background, use cases or comparisons.
        examples:
          pass: "A feature flag is a setting that turns a piece of functionality on or off at runtime, without a new deploy."
          fail: "In 2010, teams began shipping daily, and long-lived branches became a problem. Release trains grew longer each year."
      # guide_concept.md:193-194
      - id: tgdp-one-concept
        assertion: The page explains one concept, and links to other pages rather than explaining a second concept in depth.
        examples:
          pass: "Flags are often paired with gradual rollouts. See [Rollouts](rollouts.md)."
          fail: |-
            ## Canary deployments
            A canary deployment routes a small share of traffic to a new version. It runs in four stages, described below.
      # guide_concept.md:195
      - id: tgdp-no-procedures
        assertion: The page contains no numbered step-by-step instructions for performing a task.
        examples:
          pass: "To create your first flag, follow [Create a feature flag](../how-to/create-flag.md)."
          fail: |-
            1. Open **Settings**.
            2. Click **New flag**.
            3. Enter a name and click **Save**.
      # guide_concept.md:98, 208
      - id: tgdp-ties-to-the-reader
        assertion: The page says what problem the concept solves for the reader or how it benefits them.
        examples:
          pass: "Flags let you merge unfinished work without exposing it, so you can release on your own schedule."
          fail: "A feature flag is a boolean stored in the flags table and read at request time."
      # guide_concept.md:211
      - id: tgdp-has-an-example
        assertion: The page includes at least one concrete example or use case that shows the concept applied.
        examples:
          pass: "For example, a checkout team hides a new payment form behind a flag and turns it on for 5% of users first."
          fail: "Feature flags apply in many situations and offer a range of benefits."
      # guide_concept.md:218
      - id: tgdp-defines-jargon
        assertion: Specialized terms a newcomer may not know are explained in plain words where they first appear.
        examples:
          pass: "Flags are evaluated at the edge, meaning on servers close to the user rather than in your data center."
          fail: "Flags are evaluated at the edge through the PoP's KV-backed SDK shim."
