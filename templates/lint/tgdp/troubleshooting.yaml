# Troubleshooting, derived from The Good Docs Project's troubleshooting
# template at release v1.6.0 ("Iron"):
#
#   https://gitlab.com/tgdp/templates/-/blob/v1.6.0/troubleshooting/template_troubleshooting.md
#
# The upstream file is vendored at test/lint/fixtures/tgdp/template_troubleshooting.md
# and linted against this template, so the two cannot drift.
#
# The doctype is a list of symptoms, each explained by one or more causes and
# the solution or workaround for each. Upstream numbers every heading -
# `## Symptom 1`, `### Cause 2 of symptom 1` - but the numbering is
# illustrative, so the patterns here anchor on the leading word only: a page
# with one symptom, a page with five, and a page whose headings read
# `Symptom: disk full` or `Workaround` all pass. An unbounded `max` on an
# anchored rule claims the whole run of consecutive sections whose headings
# satisfy it, which is what lets the heading text be checked and repeated at
# once.
#
# v1 could not repeat a *pair* of rules, so it fell back to one rule matching
# either word ("Cause" or "Solution"), losing the doctype's actual order. v2's
# `repeat:` groups sibling rules into one repeated unit, which is exactly what
# the alternation is: each unit is one required Cause followed by one optional
# Solution or Workaround - optional because upstream's own file has a cause
# with no heading solution beneath it (the second solution in "Symptom 1" is
# unheaded prose, not a subsection). The unit itself repeats without limit, so
# a symptom may carry as many cause/solution pairs as it needs.
info:
  title: Troubleshooting (The Good Docs Project)
  version: "1.6.0"
  source: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/troubleshooting/template_troubleshooting.md

templates:
  troubleshooting:
    types:
      - troubleshooting
    description: >-
      The page itself (H1). Upstream titles it
      `# Troubleshooting {product name, feature, or task}`, a placeholder,
      so the text is left free. What the doctype does ask for is underneath
      it: the one- or two-sentence statement of what the guide covers,
      which is how a reader decides in seconds whether they are in the
      right document.
    contains:
      paragraphs:
        min: 1
    sections:
      - id: symptom
        description: >-
          One thing the reader might be seeing - an error message, a
          failure, a performance problem. An unbounded `max` claims every
          consecutive H2 whose title starts with "Symptom". The number
          upstream attaches (`## Symptom 1`) is not required, so
          `## Symptom: sync stalls` is equally acceptable.
        heading:
          pattern: '^[Ss]ymptoms?\b'
        sections:
          - id: cause-or-solution
            description: >-
              One cause of the symptom, optionally followed by its solution
              or workaround - `### Cause 1 of symptom 1`, then
              `### Solution or workaround to cause 1 of symptom 1`. The
              solution is optional within the pair because upstream's own
              file pairs a second cause with no heading solution at all.
            repeat:
              - id: cause
                description: >-
                  At least one is required: a symptom with no cause is not
                  a troubleshooting entry. Content is left unconstrained,
                  because the guide recommends bullet points for symptoms
                  and numbered steps for solutions, so a section here may
                  legitimately hold no paragraph at all.
                heading:
                  pattern: '^[Cc]auses?\b'
                max: 1
              - id: solution
                heading:
                  pattern: '^([Ss]olutions?|[Ww]orkarounds?)\b'
                min: 0
                max: 1
          - id: for-more-information
            description: >-
              Further reading for this symptom. Optional, and anchored, so
              the repeating pair above stops at it rather than treating it
              as one more cause.
            heading: For more information
            min: 0
            max: 1
      - id: for-more-information
        description: >-
          Further reading for the guide as a whole. Upstream writes this
          heading at H3, inside the last symptom, which reads like a level
          slip - its text ("other sources ... with your product, task, or
          feature") is about the product, not about one symptom. Rather
          than pick a side, the section is allowed, and optional, at both
          levels.
        heading: For more information
        min: 0
        max: 1
