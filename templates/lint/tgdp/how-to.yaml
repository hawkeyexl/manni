# Derived from The Good Docs Project "how-to" template, pinned to v1.6.0:
# https://gitlab.com/tgdp/templates/-/blob/v1.6.0/how-to/template_how-to.md
#
# The upstream Markdown is vendored at test/lint/fixtures/tgdp/template_how-to.md and
# linted against this file, so the two cannot drift. Where they disagree,
# upstream is right.
#
# v2: the template *is* the page (proposal 0061's grammar). Upstream's `# Title`
# is a placeholder, so what used to be a `title` section wrapping everything is
# now the template's own `sections:` directly - there is nothing to say about
# the H1's heading text or its own content.
info:
  title: How-to guide (The Good Docs Project)
  version: "1.6.0"
  source: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/how-to/template_how-to.md

templates:
  how-to:
    types:
      - how-to
    guide: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/how-to/guide_how-to.md
    description: >-
      Walk a reader who already knows the product through the steps to
      complete one task.
    sections:
      # What the guide explains, and optionally when and why a reader
      # would want to do it. A how-to that does not say what task it
      # covers is not a how-to, so at least one paragraph is required.
      - id: overview
        description: >-
          Say what task this guide covers, and when and why a reader would
          do it.
        heading: Overview
        max: 1
        contains:
          paragraphs:
            min: 1
      # Prerequisites. Upstream marks this "{This section is optional}",
      # and the authoring guide repeats that, so it is not required.
      # Its shape varies too much to constrain - a lead-in and a bullet
      # list in the template, but prose or grouped categories in the
      # guide's own examples - so no content counts are set.
      - id: before-you-start
        description: >-
          List what the reader needs before starting, such as background
          knowledge, software, access, or other guides to read first.
        heading: Before you start
        min: 0
        max: 1
      # The steps. Upstream's heading is the placeholder "{Task name}",
      # so this is a slot; leaving `max` unbounded lets a page carry
      # several task sections, which the guide explicitly contemplates
      # ("you may break down the task into multiple logical sub-tasks").
      # No `lists` floor: a task that delegates its procedure to
      # sub-tasks legitimately holds no ordered list of its own.
      - id: task
        description: >-
          Name the task, starting with a verb, then give its steps as a
          numbered list with one action per step.
        sections:
          # "### {Sub-task}" - another placeholder heading, and upstream
          # says to "include a sub-task only if the task is big and
          # complex", so it is optional and may occur more than once.
          - id: sub-task
            description: >-
              Break a large task into smaller parts, each with its own
              numbered steps.
            min: 0
      # Related reading. Upstream includes it unconditionally and does not
      # mark it optional the way it marks "Before you start", so it is
      # required. Its body is a mix of prose and links, so nothing is
      # counted.
      - id: see-also
        description: >-
          Link to related topics the reader may want next but does not need
          to finish this task.
        heading: See also
        max: 1
    # Judged by `manni docevals` on every page routed to this template. Each
    # assertion is one a reader of the finished page can check, drawn from
    # upstream's guide at the same pin, vendored as
    # test/lint/fixtures/tgdp/guide_how-to.md.
    evals:
      # guide_how-to.md:62-63
      - id: tgdp-overview-names-the-task
        assertion: The overview says which task the guide covers and when or why a reader would want to do it.
        examples:
          pass: "This guide explains how to rotate an API key. Rotate a key when a teammate leaves or a key may have leaked."
          fail: "This page is about API keys."
      # guide_how-to.md:49, 114
      - id: tgdp-steps-start-with-a-verb
        assertion: 'Each numbered step tells the reader what to do with an imperative verb, optionally after a short lead-in such as "To do X,".'
        examples:
          pass: "1. To change the port, open `config.yaml`."
          fail: "1. The `config.yaml` file contains the port setting."
      # guide_how-to.md:157
      - id: tgdp-one-action-per-step
        assertion: Each numbered step asks the reader to do one thing, with any further actions given as separate steps or substeps.
        examples:
          pass: "1. Run `npm install`."
          fail: "1. Open the settings file, set the port to 8080, and restart the server."
      # guide_how-to.md:155
      - id: tgdp-shows-the-result
        assertion: Where the page has the reader run commands, it shows what successful output or a successful result looks like.
        examples:
          pass: "2. Start the server with `npm start`. The terminal prints `Listening on port 8080`."
          fail: |-
            2. Start the server with `npm start`.
            3. Open the dashboard.
      # guide_how-to.md:13, 50-51
      - id: tgdp-no-concept-teaching
        assertion: The page does not stop to teach concepts; background longer than a sentence or two is linked to another page instead.
        examples:
          pass: "Webhooks send events to your server as they happen. For how delivery and retries work, see [Webhooks](../concepts/webhooks.md)."
          fail: |-
            Before you begin, you need to understand webhooks. A webhook is an HTTP callback.
            Webhooks were first described in 2007, and they differ from polling in three ways.
            First, ...
      # guide_how-to.md:42, 52
      - id: tgdp-one-method
        assertion: The page documents one recommended way to complete the task and mentions other methods only briefly or by link.
        examples:
          pass: "1. Run `acme keys rotate`. You can also rotate keys in the dashboard; see [Manage keys](keys.md)."
          fail: |-
            Option A: rotate the key with the CLI. Option B: rotate it in the dashboard.
            Option C: call the REST API. The steps for each option follow.
