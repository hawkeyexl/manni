info:
  title: README (The Good Docs Project)
  vendor: tgdp
  pin: v1.6.0
  source: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/readme/template_readme.md

# Derived from The Good Docs Project's README template. Almost every heading
# upstream interpolates a project name, so this file leans on two devices:
#
#   * A heading that is *entirely* a placeholder (`## {Project Name}`) becomes a
#     slot - a rule with no `heading` key - because there is no literal text to
#     anchor on.
#   * A heading that wraps a placeholder in stable words (`### Install {Project
#     Name}`, `## Instructions for using {Project Name}`) gets a `pattern`
#     anchored on those words. Patterns keep neighbouring sections tellable
#     apart, which a run of adjacent slots cannot do.
#
# Only the project title is required. Upstream marks the logo and table of
# contents optional outright, and treats the rest as boilerplate a project
# customises or deletes; real READMEs routinely name the same content
# differently or leave it out. So the teeth here are section *order*, the shape
# of the instructions subsections, and content minimums that bite only once a
# section is actually present.
#
# v2: the template *is* the page, so what used to be a `title` section wrapping
# everything - itself nested under a v1 root that also carried its own
# `additionalSections: true` - collapses into one level, the template's own
# `sections:`. The root's own `additionalSections` governed siblings of the H1,
# which a single page never has, so v2 has nothing to say in its place; the
# `title` rule's `additionalSections: true` is what survives, as the trailing
# `min: 0` rule at the end of this list.
templates:
  readme:
    types:
      - readme
    description: >-
      Introduce the project, say who it is for, and show how to install,
      use, and contribute to it.
    sections:
      # `## {Project} logo and badges`. Explicitly optional upstream.
      # Anchored on the words either side of the placeholder rather than
      # left as a slot, so it cannot swallow whatever section happens to
      # come first.
      - id: logo-and-badges
        description: >-
          Show the project logo, and any badges for status, build health, or
          other signs that the project is current.
        min: 0
        max: 1
        heading:
          pattern: "\\b[Ll]ogos?\\b|\\b[Bb]adges?\\b"
      # `## {Project Name}` - the heading is nothing but a placeholder,
      # so this is a slot. One section, never a run.
      - id: project-name
        description: >-
          Name the project where readers will see it first, with its URL and
          owners if they help identify it.
        min: 0
        max: 1
        sections:
          - min: 0
            description: Add any subsections this section needs here.
      # Explicitly optional upstream. A table of contents that holds no
      # list is not one, hence the list minimum.
      - id: table-of-contents
        description: >-
          List the README's sections as links, so readers can find their way
          around a long README.
        min: 0
        max: 1
        heading: Table of contents
        contains:
          lists:
            min: 1
      # What the project is and what it lets you do.
      - id: project-description
        description: >-
          Say what the project does and why a reader should care, before
          naming the tools it is built with.
        min: 0
        max: 1
        heading: Project description
        contains:
          paragraphs:
            min: 1
        sections:
          - min: 0
            description: Add any subsections this section needs here.
      # The intended audience and their objective.
      - id: who-this-project-is-for
        description: >-
          Say who the project is for, and the problems it helps them solve.
        min: 0
        max: 1
        heading: Who this project is for
        contains:
          paragraphs:
            min: 1
      # Prerequisites. No list minimum: upstream's own troubleshooting
      # content shows these sections are as often tables, which the
      # parser does not count as lists.
      - id: project-dependencies
        description: >-
          List what a reader needs before using the project, and link to how
          to get each item.
        min: 0
        max: 1
        heading: Project dependencies
      # `## Instructions for using {Project Name}`, anchored on the
      # literal opening words. Its subsections are the install/configure/
      # run/troubleshoot procedure, each of which is itself optional and
      # itself heading-anchored.
      - id: instructions-for-use
        description: >-
          Give clear, numbered steps for using the project, grouped into
          installing, configuring, running, and troubleshooting it.
        min: 0
        max: 1
        heading:
          pattern: "^Instructions\\b"
        sections:
          # `### Install {Project Name}`.
          - id: install
            description: Give the steps to install or download the project.
            min: 0
            max: 1
            heading:
              pattern: "^Install"
            sections:
              - min: 0
                description: Add any subsections this section needs here.
          # `### Configure {Project Name}`.
          - id: configure
            description: Give the steps to configure the project.
            min: 0
            max: 1
            heading:
              pattern: "^Configur"
            sections:
              - min: 0
                description: Add any subsections this section needs here.
          # `### Run {Project Name}`.
          - id: run
            description: >-
              Give the steps to run the project, and link to a quickstart if
              there is one.
            min: 0
            max: 1
            heading:
              pattern: "^Run(ning)?\\b"
            sections:
              - min: 0
                description: Add any subsections this section needs here.
          # `### Troubleshoot {Project Name}`.
          - id: troubleshoot
            description: >-
              Describe common problems and how to solve them. A table of
              issues and solutions works well.
            min: 0
            max: 1
            heading:
              pattern: "^Troubleshoot"
            sections:
              - min: 0
                description: Add any subsections this section needs here.
          - min: 0
            description: Add any other usage sections here, after the ones above.
      # How to contribute, or a link to the contributing guide.
      - id: contributing-guidelines
        description: >-
          Say how to contribute, or link to the project's contributing guide.
        min: 0
        max: 1
        heading: Contributing guidelines
        contains:
          paragraphs:
            min: 1
      # Links to further reading.
      - id: additional-documentation
        description: >-
          Link to further documentation, such as the project website and
          examples, with a short description of each.
        min: 0
        max: 1
        heading: Additional documentation
      # Support resources.
      - id: how-to-get-help
        description: >-
          Say where readers can get help, such as a mailing list, a chat
          channel, or an issue tracker.
        min: 0
        max: 1
        heading: How to get help
      # The licence the project is published under.
      - id: terms-of-use
        description: State the project's license and any other licensing terms.
        min: 0
        max: 1
        heading: Terms of use
        contains:
          paragraphs:
            min: 1
      # Tolerate a document that carries more than one top-level heading
      # beyond the ones named above.
      - min: 0
        description: Add any other sections here, after the ones above.
