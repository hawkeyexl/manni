# Release notes, derived from The Good Docs Project's published template at
# v1.6.0 ("Iron"):
# https://gitlab.com/tgdp/templates/-/blob/v1.6.0/release-notes/template_release-notes.md
#
# Almost everything here is optional, on purpose. A release notes page is a
# report on one release, and no release has every kind of change in it: a
# maintenance release with three bug fixes and nothing else is a correct
# release notes page, and a template that demanded "New features" would be
# wrong about it. What the doctype genuinely mandates is the title. What this
# template is *for* is asserting that the sections which do appear carry
# upstream's names and appear in upstream's order - so `## Bug Fixes`,
# `## Fixes`, or a "Bug fixes" section placed above "New features" is reported,
# while a page that simply omits four of the six categories is not.
#
# That assertion is why the template itself carries no trailing wildcard rule:
# an unrecognised H2 has to be reported for the naming check to have any force.
# Inside a category the opposite holds - upstream prescribes the category
# headings, not how a category is subdivided - so each one ends with a
# trailing `min: 0` rule that lets any subsection through.
#
# There are no paragraph, list, or code-block minimums anywhere. Upstream marks
# only the release date as non-optional prose, and a category whose body is a
# single bullet list, a table, or a paragraph are all ordinary shapes for this
# doctype; counting blocks would fail correct pages without catching a real
# structural mistake.
info:
  title: Release notes (The Good Docs Project)
  version: "1.6.0"
  source: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/release-notes/template_release-notes.md

templates:
  release-notes:
    types:
      - release-notes
    guide: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/release-notes/guide_release-notes.md
    # The page itself. Upstream titles it
    # `Release notes - {Product name} {Release number}`; only the braced
    # parts are placeholders, so the literal prefix is the one thing this
    # template insists on. Its body carries the release version, the
    # release date, and an optional high-level summary.
    description: >-
      Tell readers what changed in one release and why it matters to them.
      Start the title with Release notes, then the product name and release
      number.
    heading:
      pattern: '^Release [Nn]otes\b'
    sections:
      # Functionality this release adds. Omitted by a release that adds none.
      - id: new-features
        description: >-
          Describe each new feature and how it benefits the reader, most
          important first.
        heading: New features
        min: 0
        max: 1
        sections:
          - min: 0
            description: Add any subsections this section needs here.

      # New functionality that does not switch itself on. Separated from
      # `New features` upstream because these entries are action items
      # for the reader, not announcements.
      - id: new-features-requiring-configuration-updates
        description: >-
          Describe each new feature the reader must configure before using
          it, and what they need to change.
        heading: New features requiring configuration updates
        min: 0
        max: 1
        sections:
          - min: 0
            description: Add any subsections this section needs here.

      # Changes to functionality that already existed - speed, usability,
      # behaviour.
      - id: improvements
        description: >-
          Describe changes to existing features and how they benefit the
          reader, most important first.
        heading: Improvements
        min: 0
        max: 1
        sections:
          - min: 0
            description: Add any subsections this section needs here.

      # Changes to programmatic interfaces, which have a different audience
      # from the rest of the page.
      - id: api-web-service-updates
        description: Describe changes to the product's APIs and web services.
        heading: API/Web service updates
        min: 0
        max: 1
        sections:
          - min: 0
            description: Add any subsections this section needs here.

      # Defects resolved in this release.
      - id: bug-fixes
        description: >-
          Describe what each fix changes for the reader, by comparing what
          the software did before with what it does now.
        heading: Bug fixes
        min: 0
        max: 1
        sections:
          # Defects that are known and *not* resolved. Upstream nests this
          # under `Bug fixes` rather than making it a category of its own,
          # which puts what is still broken next to what was fixed.
          - id: known-issues
            description: >-
              Describe the problems this release does not fix, with a
              workaround where one exists.
            heading: Known issues
            min: 0
            max: 1
            sections:
              - min: 0
                description: Add any subsections this section needs here.
          - min: 0
            description: Add any other subsections here, after the ones above.

      # Functionality being retired, with the date it stops being
      # supported and what replaces it. Upstream writes the heading as
      # `Optional: Deprecation notice`, so the pattern accepts the
      # published form as well as the one a real page would use.
      - id: deprecation-notice
        description: >-
          Name each feature being removed, say when support ends, and say
          what replaces it and what the reader must do.
        heading:
          pattern: '^(Optional: )?Deprecation notice$'
        min: 0
        max: 1
        sections:
          - min: 0
            description: Add any subsections this section needs here.
    # Judged by `manni docevals` on every page routed to this template. Each
    # assertion is one a reader of the finished page can check, drawn from
    # upstream's guide at the same pin, vendored as
    # test/lint/fixtures/tgdp/guide_release-notes.md.
    evals:
      # guide_release-notes.md:54
      - id: tgdp-addresses-the-reader
        assertion: 'The notes address the reader in the second person, as "you", rather than as "the user" or "customers".'
        examples:
          pass: "You can now export reports as CSV."
          fail: "Users can now export reports as CSV."
      # guide_release-notes.md:57
      - id: tgdp-present-tense
        assertion: 'New features and improvements are described in the present tense, such as "You can now export", rather than "We added" or "will let you".'
        examples:
          pass: "You can now export reports as CSV."
          fail: "We added CSV export, which will let you share reports."
      # guide_release-notes.md:10, 90, 188
      - id: tgdp-says-why-it-matters
        assertion: Each new feature and improvement says how it benefits the reader, not only what changed.
        examples:
          pass: "You can now export reports as CSV, so you can analyze them in a spreadsheet."
          fail: "Added CSV export."
      # guide_release-notes.md:92, 190
      - id: tgdp-links-to-docs
        assertion: Each new feature and improvement links to documentation where the reader can learn more.
        examples:
          pass: "You can now export reports as CSV. See [Export reports](../reports/export.md)."
          fail: "You can now export reports as CSV."
      # guide_release-notes.md:221-222, 224
      - id: tgdp-fixes-say-what-changed
        assertion: Where the notes list bug fixes, each says what the software does now, not how the bug was fixed.
        examples:
          pass: "The Orders page now sorts orders from newest to oldest."
          fail: "Fixed the bug by changing the ORDER BY clause in OrderRepository."
      # guide_release-notes.md:260, 262
      - id: tgdp-known-issues-have-workarounds
        assertion: Where the notes list known issues, each describes when the problem occurs and gives a workaround where one exists.
        examples:
          pass: "If you upgrade from 5.x with `refreshToken` enabled, scheduled jobs stop. To restore them, sign out and sign back in."
          fail: "Some scheduled jobs may have problems."
      # guide_release-notes.md:282-285
      - id: tgdp-deprecations-are-complete
        assertion: Where the notes deprecate a feature, each names the feature, what replaces it, when it is removed, and any action the reader must take.
        examples:
          pass: "The Classic editor is deprecated and is removed on 2027-03-01. Switch to the Block editor; your drafts move over automatically."
          fail: "The Classic editor is deprecated."
