# Reference, derived from The Good Docs Project's `reference/template_reference.md`
# at release v1.6.0. The upstream Markdown is vendored at
# `test/lint/fixtures/tgdp/template_reference.md` and linted against this file, so the
# two cannot drift.
#
# v2: upstream ships the H1 as `# Reference template`, but a real reference
# names its own subject, so there is nothing to say about the page's own
# heading. No paragraph minimum either: the published template carries only
# block quotes under the H1, and a reference that opens straight into its
# first entry section is well formed.
info:
  title: Reference (The Good Docs Project)
  version: "1.6"
  source: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/reference/template_reference.md

templates:
  reference:
    types:
      - reference
    guide: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/reference/guide_reference.md
    description: >-
      Describe the parts of the product in a structured form the reader can
      scan quickly. Keep step-by-step instructions out of it.

    sections:
      # `## {Reference description}` - a placeholder heading, so a slot.
      # Summarizes what the reference covers and how it relates to the
      # rest of the doc set. Required: the guide makes this the section
      # that "concisely summarizes the reference article's content and
      # purpose".
      - id: reference-description
        description: >-
          Briefly summarize what this reference covers and what the reader
          can find in it.
        max: 1

      # `## {Table name or other structured entry}` - a placeholder
      # heading standing for a repeated section, so a slot with an
      # unbounded `max`. Claims every consecutive section up to
      # `commands` or `related`. Optional because it and
      # `reference-description` are both unconstrained placeholders: the
      # matcher cannot tell "the description" from "the first entry", so
      # requiring both would
      # mandate two H2s where the doctype only asks that entries exist.
      # The node model can name a table directly (proposal 0065), so this
      # asks for one. Every parser reports tables now, so the rule runs and
      # upstream's own table satisfies it. Against a format that cannot
      # report them the rule is pruned and reported as an
      # `unsupported_content_kind` warning, rather than silently passing or
      # failing a page for a shape that format cannot show.
      - id: structured-entry
        description: >-
          Present the reference information in a table the reader can scan.
          Use one section for each table or group of entries.
        min: 0
        contains:
          tables:
            min: 1

      # `## (Optional) Commands`. The guide calls this "this optional
      # section" outright. The pattern accepts the heading with the
      # `(Optional)` marker still attached, as upstream ships it, and
      # with the marker removed, as an author who keeps the section would
      # write it. A section named anything else - "CLI commands",
      # "Command reference" - simply falls to the entry slot above.
      - id: commands
        description: >-
          List the commands, each with a short description and an example,
          and say which settings are required or optional.
        min: 0
        max: 1
        heading:
          pattern: '^(?:\(Optional\)\s+)?Commands$'

      # Trailing related-reading sections. Reference pages routinely end
      # with them, the doctype does not enumerate them, and upstream does
      # not forbid them. Named so the entry slot above stops before them
      # rather than asking them for a table. No `max`, so a page can end
      # with both "Notes" and "See also". With a bound of one, the entry
      # slot would take the first of the two.
      - id: related
        description: >-
          Link to related pages, or add notes that the entries above do not
          cover.
        min: 0
        heading:
          - See also
          - Related information
          - Related resources
          - Notes

      # Anything after those is the author's own, and upstream does not forbid
      # it, so it is not a finding.
      - min: 0
        description: Add any other sections here, after the ones above.
    # Judged by `manni docevals` on every page routed to this template. Each
    # assertion is one a reader of the finished page can check, drawn from
    # upstream's guide at the same pin, vendored as
    # test/lint/fixtures/tgdp/guide_reference.md.
    evals:
      # guide_reference.md:47-50
      - id: tgdp-description-states-purpose
        assertion: The opening briefly says what the page covers and what a reader uses it for.
        examples:
          pass: "This page lists every key in `app.config.yaml`, with its type, default and effect."
          fail: |-
            | Key | Type | Default |
            |---|---|---|
      # guide_reference.md:7, 36
      - id: tgdp-no-procedures
        assertion: The page describes parts of the product and does not walk the reader through a numbered procedure for a task.
        examples:
          pass: "`timeout` (integer, default 30): seconds to wait for a response before the request fails."
          fail: |-
            1. Open `app.config.yaml`.
            2. Set `timeout` to 60.
            3. Restart the service.
      # guide_reference.md:56-57, 61
      - id: tgdp-entries-in-tables-or-lists
        assertion: The entries are presented in tables, lists or another structured format rather than in running paragraphs.
        examples:
          pass: |-
            | Key | Type | Default |
            |---|---|---|
            | `timeout` | integer | 30 |
          fail: "The timeout key is an integer that defaults to 30, while the retries key, also an integer, defaults to 3, and the host key is a string."
      # guide_reference.md:35, 58
      - id: tgdp-entries-are-parallel
        assertion: Entries of the same kind follow one consistent structure, giving the same kinds of details for each entry.
        examples:
          pass: |-
            - `timeout` (integer, default 30): seconds before a request fails.
            - `retries` (integer, default 3): attempts before the client gives up.
          fail: |-
            - `timeout` (integer, default 30): seconds before a request fails.
            - `retries`: see the source code.
      # guide_reference.md:67-69
      - id: tgdp-commands-show-arguments-and-example
        assertion: Where the page documents a command, it shows an example invocation and says which of its arguments or options are required.
        examples:
          pass: |-
            `acme deploy <env> [--dry-run]`. `<env>` is required.
            Example: `acme deploy staging --dry-run`
          fail: "`acme deploy` deploys the application."
