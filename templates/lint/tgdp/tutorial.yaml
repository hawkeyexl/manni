# Tutorial, derived from The Good Docs Project's tutorial template.
#
# Upstream (the authority for every heading below):
#   https://gitlab.com/tgdp/templates/-/blob/v1.6.0/tutorial/template_tutorial.md
#   https://gitlab.com/tgdp/templates/-/blob/v1.6.0/tutorial/guide_tutorial.md
#
# The upstream Markdown is vendored at test/lint/fixtures/tgdp/template_tutorial.md
# and linted against this file, so the two cannot drift.
#
# What is checked here is structure: which sections a tutorial has, and in what
# order. Content counts are almost entirely absent on purpose - a tutorial's
# steps may be a numbered list, a run of subsections, or a mix, and a minimum
# tuned to the sample page would reject real pages that are perfectly good
# tutorials.
#
# v2: upstream's `# Title` is a placeholder, so there is nothing to say about
# the page's own heading or content - what used to wrap everything in a
# `title` section is now the template's own `sections:`.
info:
  title: Tutorial (The Good Docs Project)
  version: "1.6.0"
  vendor: tgdp
  pin: v1.6.0

templates:
  tutorial:
    types:
      - tutorial
    guide: https://gitlab.com/tgdp/templates/-/blob/v1.6.0/tutorial/guide_tutorial.md
    description: >-
      Teach the reader a new skill by walking them through a hands-on project
      from start to finish.
    sections:
      # What the reader will be able to do by the end, who the tutorial
      # is for, and the background knowledge it assumes. The guide calls
      # this the section that decides whether a reader starts at all, so
      # it must say something in prose.
      - id: overview
        heading: Overview
        max: 1
        description: >-
          Say what the reader will be able to do by the end, who the tutorial
          is for, and what they should already know.
        contains:
          paragraphs:
            min: 1
      # Context the reader needs before starting - what the feature is,
      # or how a supplied starter project is laid out. Upstream marks
      # this section optional in the template body ("{This section is
      # optional.}").
      - id: background
        heading: Background
        min: 0
        max: 1
        description: >-
          Give the context the reader needs before starting, such as how the
          feature works or how the starter project is organized.
      # Prerequisites: prior knowledge, software, environments, access.
      # No content minimum - a prerequisites section that is nothing but
      # a bulleted list is idiomatic.
      - id: before-you-start
        heading: Before you start
        max: 1
        description: >-
          List what the reader needs before starting, such as software,
          languages, accounts, or access.
      # One task the tutorial walks the reader through. Upstream heads it
      # with a placeholder (`## {Task name}`), so this rule constrains no
      # heading text. Leaving `max` unbounded is what lets a tutorial be a
      # sequence of these: the placeholder stands for however many the
      # page needs.
      - id: task
        description: >-
          Name one task and walk the reader through its steps as a numbered
          list. Add one section for each task.
      # The skills and knowledge the reader has gained, stated as
      # outcomes rather than as a repeat of the learning objectives.
      - id: summary
        heading: Summary
        max: 1
        description: >-
          List the skills and knowledge the reader gained, without repeating
          the learning objectives word for word.
      # Links onward - related tutorials, articles, videos.
      - id: next-steps
        heading: Next steps
        max: 1
        description: >-
          Link to related tutorials, articles, or videos the reader can try
          next.
    # Judged by `manni docevals` on every page routed to this template. Each
    # assertion is one a reader of the finished page can check, drawn from
    # upstream's guide at the same pin, vendored as
    # test/lint/fixtures/tgdp/guide_tutorial.md.
    evals:
      # guide_tutorial.md:50, 54
      - id: tgdp-objectives-stated
        assertion: The opening says what the reader will be able to do or know by the end of the tutorial.
        examples:
          pass: "By the end of this tutorial, you'll be able to deploy a static site and add a custom domain."
          fail: "This tutorial covers static sites."
      # guide_tutorial.md:68
      - id: tgdp-audience-and-prior-knowledge
        assertion: The opening says who the tutorial is for and what the reader should already know before starting.
        examples:
          pass: "This tutorial is for frontend developers new to Acme. You should be comfortable with Git and the command line."
          fail: "In this tutorial, we deploy a site."
      # guide_tutorial.md:93, 105-106
      - id: tgdp-steps-start-with-a-verb
        assertion: Each numbered step starts with an imperative verb and states a complete action.
        examples:
          pass: "1. Create a file named `app.js` in the project root."
          fail: "1. Creating the app file."
      # guide_tutorial.md:31-33, 112
      - id: tgdp-code-is-self-contained
        assertion: Where the tutorial gives source code to copy, other than one-line shell commands, it includes needed imports and comments explaining what it does.
        examples:
          pass: |-
            import express from "express";
            // Serve the files in ./public on port 3000.
            express().use(express.static("public")).listen(3000);
          fail: 'express().use(express.static("public")).listen(3000);'
      # guide_tutorial.md:160-162
      - id: tgdp-summary-says-what-was-learned
        assertion: The summary names specific skills or knowledge the reader gained, rather than repeating the opening objectives word for word.
        examples:
          pass: "You built a two-page site, deployed it with `acme deploy`, and pointed a custom domain at it with a CNAME record."
          fail: "By the end of this tutorial, you'll be able to deploy a static site and add a custom domain."
