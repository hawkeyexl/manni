docs/src/content/docs/meta/reference/cli.mdx:
  personas:
    - maya
    - devin
    - sara
    - theo
  visibility: public
  review-interval: P180D
  source-of-truth:
    - path: src/meta/cli.ts
  eval-suite: meta
  evals:
    - id: find-command-flag
      assertion: A reader can find the flag that changes a manni meta command's behavior and state its default.
      type: capability
      grader: ai
    - id: use-shared-input-model
      assertion: A reader can pass paths, stdin with --as, or a configured collection to any manni meta command that takes inputs.
      type: capability
      grader: ai
