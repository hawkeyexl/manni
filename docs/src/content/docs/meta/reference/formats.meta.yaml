docs/src/content/docs/meta/reference/formats.mdx:
  personas:
    - maya
    - devin
    - sara
    - theo
  visibility: public
  review-interval: P180D
  source-of-truth:
    - path: src/meta/extractors
  eval-suite: meta
  evals:
    - id: pick-format-extractor
      assertion: A reader can say which extractor reads a given file extension and force another with --as.
      type: capability
      grader: ai
    - id: predict-writability
      assertion: A reader can say whether fill can write metadata into a file of a given format.
      type: capability
      grader: ai
