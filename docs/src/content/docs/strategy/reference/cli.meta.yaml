docs/src/content/docs/strategy/reference/cli.mdx:
  personas:
    - sara
  journeys:
    - s17
  visibility: public
  review-interval: P180D
  source-of-truth:
    - path: src/strategy/cli.ts
    - path: src/strategy/core/config.ts
  eval-suite: strategy
  evals:
    - id: find-flag
      assertion: A reader can find the flags, output and exit codes of any manni strategy command.
      type: capability
      grader: ai
    - id: read-usage-error
      assertion: A reader can match a manni strategy usage error to the invocation that caused it.
      type: capability
      grader: ai
