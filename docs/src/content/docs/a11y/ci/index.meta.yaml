docs/src/content/docs/a11y/ci/index.mdx:
  personas: ["devin"]
  journeys: ["d7"]
  visibility: public
  review-interval: P180D
  source-of-truth:
    - path: "src/a11y/reporters/github.ts"
    - path: "src/a11y/core/config.ts"
  eval-suite: a11y
  evals:
    - id: scheduled-and-pr-jobs
      assertion: "A reader can write a scheduled job and a pull request job that run manni a11y check."
      type: capability
      grader: ai
    - id: annotations-and-exit-codes
      assertion: "A reader can produce GitHub annotations and say which exit code fails the job."
      type: capability
      grader: ai
