docs/src/content/docs/term/set-up/index.mdx:
  personas:
    - maya
  journeys:
    - m9
  visibility: public
  review-interval: P180D
  source-of-truth:
    - path: src/term/commands
    - path: src/term/core/writers
    - path: src/term/core/vale.ts
    - path: src/term/core/writers/vale.ts
    - path: src/term/reporters
  eval-suite: term
  evals:
    - id: generate-vale-style
      assertion: A reader can generate the Terms style with manni term write -f vale and add it to BasedOnStyles.
      type: capability
      grader: ai
    - id: lint-definitions
      assertion: A reader can run manni term lint and map its findings back to the field lines of a term.
      type: capability
      grader: ai
