docs/src/content/docs/term/set-up/move-and-hand-off.mdx:
  personas:
    - devin
  journeys:
    - d8
  visibility: public
  review-interval: P180D
  source-of-truth:
    - path: src/term/commands
    - path: src/term/core/writers
    - path: src/term/core/vale.ts
    - path: src/term/core/writers/vale.ts
    - path: src/term/reporters
  eval-suite: term
  evals:
    - id: move-glossary-to-pages
      assertion: A reader can render a DocBook glossary as term pages and render them back into one file.
      type: capability
      grader: ai
    - id: hand-off-for-translation
      assertion: A reader can write the term set as TBX or CSV for a translation system and say which fields each drops.
      type: capability
      grader: ai
