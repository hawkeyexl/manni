docs/src/content/docs/term/get-started/index.mdx:
  personas:
    - sara
  journeys:
    - s6
  visibility: public
  review-interval: P180D
  source-of-truth:
    - path: src/term/commands
    - path: src/term/core/writers
    - path: src/term/core/vale.ts
    - path: src/term/core/writers/vale.ts
    - path: src/term/reporters
  eval-suite: term
  evals:
    - id: write-term-pages
      assertion: "A reader can write a type: term page with a label, a definition and alt-labels."
      type: capability
      grader: ai
    - id: fix-undefined-term
      assertion: A reader can run manni term check and fix an undefined-term finding by using the preferred label.
      type: capability
      grader: ai
