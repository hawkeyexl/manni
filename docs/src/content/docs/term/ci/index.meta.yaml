docs/src/content/docs/term/ci/index.mdx:
  personas:
    - devin
    - maya
  journeys:
    - d8
    - m9
  visibility: public
  review-interval: P180D
  source-of-truth:
    - path: src/term/commands
    - path: src/term/core/writers
    - path: src/term/core/vale.ts
    - path: src/term/core/writers/vale.ts
    - path: src/term/reporters
  eval-suite: term
  evals:
    - id: write-ci-workflow
      assertion: A reader can write a GitHub Actions workflow that runs term check, term lint and write -f vale --check.
      type: capability
      grader: ai
    - id: ramp-with-baseline
      assertion: A reader can record a baseline and gate only on findings the baseline does not hold.
      type: capability
      grader: ai
